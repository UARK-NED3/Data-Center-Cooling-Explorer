name: Render release previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: MATLAB R2025b preview render
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Start virtual display for app rendering
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          Xvfb :99 -screen 0 1440x900x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Render preview assets
        uses: matlab-actions/run-command@v3
        with:
          command: "run('scripts/renderPreview.m');"

      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: release-previews
          if-no-files-found: error
          path: |
            docs/explorer-demo.gif
            docs/*-preview.png
